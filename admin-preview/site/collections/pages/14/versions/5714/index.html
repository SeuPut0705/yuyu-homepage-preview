ll,\"image\":null,\"blockName\":null,\"ctas\":[],\"blockType\":\"hero\",\"eyebrow\":null,\"heading\":\"개인정보처리방침\",\"lead\":null},{\"id\":\"6ae0dcd28a9c7b0288bcd028\",\"anchor\":null,\"blockName\":null,\"blockType\":\"richText\",\"heading\":null,\"content\":{\"root\":{\"type\":\"root\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"㈜유유헬스케어(www.yuyuhc.co.kr 이하 ‘회사’)은 이용자의 개인정보를 중요시하며, “정보통신망 이용촉진 및 정보보호에 관한 법률”을 준수하고 있습니다. \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 회사는 개인정보취급방침을 통하여 이용자가 제공한 개인정보가 어떠한 용도와 방식으로 이용되고 있으며, 개인정보보호를 위해 어떠한 조치가 취해지고 있는지 알려드립니다. \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 회사는 개인정보취급방침을 개정하는 경우 웹사이트 공지사항을 통하여 공지할 것입니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 본 방침은 2007년 10월 15일부터 시행됩니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"1. 수집하는 개인정보 항목\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"당사는 고객문의 및 비즈니스 상담 등을 위해 아래와 같은 개인정보를 수집하고 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"서비스명 · 수집목적 · 수집항목\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"고객문의 · 고객문의 응대 · 필수) 이름, 연락처(천화번호), 이메일주소, 게시물 조회 비밀번호, 문의 내용(제목, 문의 내용(제목, 문의내용, 첨부파일)\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"비즈니스상담 · 비즈니스 상담 응대 · 필수) 법인명, 본사 소재지, 이름, 이메일, 연락처\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"2. 개인정보의 보유 및 이용기간\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 회사에서 제공하는 서비스를 이용하는 동안 회사는 이용자들의 개인정보를 계속적으로 보유하며 서비스 제공 등을 위해 이용합니다. 다만, 정보주체의 삭제 요청 있을 시 개인정보를 지체없이 파기 합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"보존 항목 · 보존 목적 · 보존 근거 · 보존 기간\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"필수) 이름, 전화번호, 이메일 주소, 문의내용 · 고객 문의 응대 처리 및 처리 이력관리 · 소비자 불만 또는 분쟁 처리에 관한 기록 · 3년\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"필수) 법인명, 본사소재지, 이름, 이메일, 연락처 · 비즈니스 상담 응대처리 및 처리 이력 관리\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"IP Adress 로그인 기록 · 서비스 유지 및 사용 기록 확인 · 통신비밀보호법 · 3개월\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"3. 개인정보의 파기절차 및 방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"회사는 원칙적으로 개인정보 수집 및 이용목적이 달성된 후에는 해당 정보를 지체 없이 파기합니다. 파기절차 및 방법은 다음과 같습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"1) 파기절차 : 이용자들이 서비스를 제공 받기 위해 입력하신 정보는 목적이 달성된 후 내부 방침 및 기타 관련 법령에 의한 정보보호사유에 따라(보유 및 이용기간 참조) 일정기간 저장된 후 파기되어집니다. 동 개인정보는 법률에 의한 경우가 아니고서는 보유되어지는 것 외의 다른 목적으로 이용되지 않습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"2) 파기방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 가. 전자적 파일형태로 저장된 개인정보는 기록을 재생할 수 없는 기술적방법을 사용하여 삭제합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 나. 종이에 출력된 개인정보는 분쇄기로 분쇄하거나 소각을 통하여 파기합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"4. 개인정보 제공\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"회사는 이용자의 개인정보를 원칙적으로 외부에 제공하지 않습니다. 다만, 아래의 경우에는 예외로 합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"1) 이용자들이 사전에 동의한 경우\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 2) 법령의 규정에 의거하거나, 수사 목적으로 법령에 정해진 절차와 방법에 따라 수사기관의 요구가 있는 경우\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"5. 수집한 개인정보의 위탁\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 회사는 이용자의 동의 없이 개인정보를 외부 업체에 위탁하지 않습니다. 향후 그러한 필요가 생길 경우, 위탁 대상자와 위탁 업무 내용에 대해 이용자에게 통지하고 필요한 경우 사전 동의를 받도록 하겠습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"6. 이용자 및 법정대리인의 권리와 그 행사방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"이용자는 개인의 정보를 열람할 수 있으며 보관된 개인정보에 대해 수정 요청할 수 있습니다. 개인정보의 변경 및 삭제는 고객지원의 홈페이지 문의를 통하여 할 수 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"7. 개인정보 자동수집 장치의 설치, 운영 및 그 거부에 관한 사항\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 회사는 이용자의 정보를 수시로 저장하고 찾아내는 '쿠키(cookie)' 등을 운용합니다. 쿠키란 회사의 웹사이트를 운영하는데 이용되는 서버가 이용자의 브라우저에 보내는 아주 작은 텍스트 파일로서 귀하의 컴퓨터 하드디스크에 저장됩니다. 회사는 다음과 같은 목적을 위해 쿠키를 사용합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 1) 쿠키 등 사용 목적 : 이용자의 방문 회수 파악 및 접속한 웹 페이지의 분석, 기타 서비스(온라인 문의, 주식정보 등)를 사용하기 위한 목적으로 이용됩니다. 이용자는 쿠키 설치에 대한 선택권을 가지고 있습니다. 따라서, 이용자는 웹 브라우저에서 옵션을 설정함으로써 모든 쿠키를 허용하거나, 쿠키가 저장될 때마다 확인을 거치거나, 아니면 모든 쿠키의 저장을 거부할 수도 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"2) 쿠키 설정 거부 방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 쿠키 설정을 거부하는 방법으로는 이용자가 사용하는 웹 브라우저의 옵션을 선택함으로써 모든 쿠키를 허용하거나 쿠키를 저장할 때마다 확인을 거치거나, 모든 쿠키의 저장을 거부할 수 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"* 쿠키 설정방법 예\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1},{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 1) Internet Explorer : 웹 브라우저 상단의 도구 \u003e 인터넷 옵션 \u003e 개인정보 \u003e 고급 (단, 이용자가 쿠키 설치를 거부하였을 경우 서비스 제공에 어려움이 있을 수 있습니다.) \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 2) Chrome : 웹 브라우저 우측의 설정 메뉴 \u003e 화면 하단의 고급 설정 표시 \u003e 개인정보의 콘텐츠 설정 버튼 \u003e 쿠키\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"8. 개인정보에 관한 민원서비스\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"회사는 이용자의 개인정보를 보호하고 개인정보와 관련한 불만을 처리하기 위하여 아래와 같이 개인정보관리책임자를 지정하고 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"9. 개인정보관리책임자\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"성명 · 소속부서 · 전화번호 · 이메일\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1}],\"direction\":\"ltr\", 망 이용촉진 및 정보보호에 관한 법률”을 준수하고 있습니다. \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 회사는 개인정보취급방침을 통하여 이용자가 제공한 개인정보가 어떠한 용도와 방식으로 이용되고 있으며, 개인정보보호를 위해 어떠한 조치가 취해지고 있는지 알려드립니다. \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 회사는 개인정보취급방침을 개정하는 경우 웹사이트 공지사항을 통하여 공지할 것입니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 본 방침은 2007년 10월 15일부터 시행됩니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"1. 수집하는 개인정보 항목\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"당사는 고객문의 및 비즈니스 상담 등을 위해 아래와 같은 개인정보를 수집하고 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"서비스명 · 수집목적 · 수집항목\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"고객문의 · 고객문의 응대 · 필수) 이름, 연락처(천화번호), 이메일주소, 게시물 조회 비밀번호, 문의 내용(제목, 문의 내용(제목, 문의내용, 첨부파일)\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"비즈니스상담 · 비즈니스 상담 응대 · 필수) 법인명, 본사 소재지, 이름, 이메일, 연락처\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"2. 개인정보의 보유 및 이용기간\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 회사에서 제공하는 서비스를 이용하는 동안 회사는 이용자들의 개인정보를 계속적으로 보유하며 서비스 제공 등을 위해 이용합니다. 다만, 정보주체의 삭제 요청 있을 시 개인정보를 지체없이 파기 합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"보존 항목 · 보존 목적 · 보존 근거 · 보존 기간\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"필수) 이름, 전화번호, 이메일 주소, 문의내용 · 고객 문의 응대 처리 및 처리 이력관리 · 소비자 불만 또는 분쟁 처리에 관한 기록 · 3년\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"필수) 법인명, 본사소재지, 이름, 이메일, 연락처 · 비즈니스 상담 응대처리 및 처리 이력 관리\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"IP Adress 로그인 기록 · 서비스 유지 및 사용 기록 확인 · 통신비밀보호법 · 3개월\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"3. 개인정보의 파기절차 및 방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"회사는 원칙적으로 개인정보 수집 및 이용목적이 달성된 후에는 해당 정보를 지체 없이 파기합니다. 파기절차 및 방법은 다음과 같습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"1) 파기절차 : 이용자들이 서비스를 제공 받기 위해 입력하신 정보는 목적이 달성된 후 내부 방침 및 기타 관련 법령에 의한 정보보호사유에 따라(보유 및 이용기간 참조) 일정기간 저장된 후 파기되어집니다. 동 개인정보는 법률에 의한 경우가 아니고서는 보유되어지는 것 외의 다른 목적으로 이용되지 않습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"2) 파기방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 가. 전자적 파일형태로 저장된 개인정보는 기록을 재생할 수 없는 기술적방법을 사용하여 삭제합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 나. 종이에 출력된 개인정보는 분쇄기로 분쇄하거나 소각을 통하여 파기합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"4. 개인정보 제공\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"회사는 이용자의 개인정보를 원칙적으로 외부에 제공하지 않습니다. 다만, 아래의 경우에는 예외로 합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"1) 이용자들이 사전에 동의한 경우\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 2) 법령의 규정에 의거하거나, 수사 목적으로 법령에 정해진 절차와 방법에 따라 수사기관의 요구가 있는 경우\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"5. 수집한 개인정보의 위탁\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 회사는 이용자의 동의 없이 개인정보를 외부 업체에 위탁하지 않습니다. 향후 그러한 필요가 생길 경우, 위탁 대상자와 위탁 업무 내용에 대해 이용자에게 통지하고 필요한 경우 사전 동의를 받도록 하겠습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"6. 이용자 및 법정대리인의 권리와 그 행사방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"이용자는 개인의 정보를 열람할 수 있으며 보관된 개인정보에 대해 수정 요청할 수 있습니다. 개인정보의 변경 및 삭제는 고객지원의 홈페이지 문의를 통하여 할 수 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"7. 개인정보 자동수집 장치의 설치, 운영 및 그 거부에 관한 사항\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 회사는 이용자의 정보를 수시로 저장하고 찾아내는 '쿠키(cookie)' 등을 운용합니다. 쿠키란 회사의 웹사이트를 운영하는데 이용되는 서버가 이용자의 브라우저에 보내는 아주 작은 텍스트 파일로서 귀하의 컴퓨터 하드디스크에 저장됩니다. 회사는 다음과 같은 목적을 위해 쿠키를 사용합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 1) 쿠키 등 사용 목적 : 이용자의 방문 회수 파악 및 접속한 웹 페이지의 분석, 기타 서비스(온라인 문의, 주식정보 등)를 사용하기 위한 목적으로 이용됩니다. 이용자는 쿠키 설치에 대한 선택권을 가지고 있습니다. 따라서, 이용자는 웹 브라우저에서 옵션을 설정함으로써 모든 쿠키를 허용하거나, 쿠키가 저장될 때마다 확인을 거치거나, 아니면 모든 쿠키의 저장을 거부할 수도 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"2) 쿠키 설정 거부 방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 쿠키 설정을 거부하는 방법으로는 이용자가 사용하는 웹 브라우저의 옵션을 선택함으로써 모든 쿠키를 허용하거나 쿠키를 저장할 때마다 확인을 거치거나, 모든 쿠키의 저장을 거부할 수 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"* 쿠키 설정방법 예\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1},{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 1) Internet Explorer : 웹 브라우저 상단의 도구 \u003e 인터넷 옵션 \u003e 개인정보 \u003e 고급 (단, 이용자가 쿠키 설치를 거부하였을 경우 서비스 제공에 어려움이 있을 수 있습니다.) \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 2) Chrome : 웹 브라우저 우측의 설정 메뉴 \u003e 화면 하단의 고급 설정 표시 \u003e 개인정보의 콘텐츠 설정 버튼 \u003e 쿠키\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"8. 개인정보에 관한 민원서비스\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"회사는 이용자의 개인정보를 보호하고 개인정보와 관련한 불만을 처리하기 위하여 아래와 같이 개인정보관리책임자를 지정하고 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"9. 개인정보관리책임자\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"성명 · 소속부서 · 전화번호 · 이메일\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"한기수 · 기획팀 · 02-6972-9171 · hanks@yuyu.co.kr\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 귀하께서는 회사의 서비스를 이용하시며 발생하는 모든 개인정보보호 관련 민원을 개인정보관리책임자 혹은 담당부서로 신고하실 수 있습니다. 회사는 이용자들의 신고사항에 대해 신속하게 충분한 답변을 드릴 것입니다. 기타 개인정보침해에 대한 신고나 상담이 필요하신 경우, 아래 기관에 문의하시기 바랍니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"개인분쟁조정위원회\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\"text\":\" www.1336.or.kr \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\"text\":\" 1336 \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"정보보호마크인증위원회\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\"text\":\" www.eprivacy.or.kr \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\"text\":\" 02-580-053 n\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0}],\"direction\":\"ltr\"}}}}],\"diffMethod\":\"diffWordsWithSpace\",\"field\":\"$1c:props:config:collections:0:fields:5\",\"fieldPermissions\":true,\"parentIsLocalized\":false,\"versionValue\":[{\"id\":\"6ae0dcd28a9c7b0288bcd027\",\"anchor\":null,\"image\":null,\"blockName\":null,\"ctas\":[],\"blockType\":\"hero\",\"eyebrow\":{\"ko\":null},\"heading\":{\"ko\":\"개인정보처리방침\"},\"lead\":{\"ko\":null}},{\"id\":\"6ae0dcd28a9c7b0288bcd028\",\"anchor\":null,\"blockName\":null,\"blockType\":\"richText\",\"heading\":{\"ko\":null},\"content\":{\"ko\":{\"root\":{\"type\":\"root\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"㈜유유헬스케어(www.yuyuhc.co.kr 이하 ‘회사’)은 이용자의 개인정보를 중요시하며, “정보통신망 이용촉진 및 정보보호에 관한 법률”을 준수하고 있습니다. \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 회사는 개인정보취급방침을 통하여 이용자가 제공한 개인정보가 어떠한 용도와 방식으로 이용되고 있으며, 개인정보보호를 위해 어떠한 조치가 취해지고 있는지 알려드립니다. \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 회사는 개인정보취급방침을 개정하는 경우 웹사이트 공지사항을 통하여 공지할 것입니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 본 방침은 2007년 10월 15일부터 시행됩니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"1. 수집하는 개인정보 항목\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"당사는 고객문의 및 비즈니스 상담 등을 위해 아래와 같은 개인정보를 수집하고 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"서비스명 · 수집목적 · 수집항목\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"고객문의 · 고객문의 응대 · 필수) 이름, 연락처(천화번호), 이메일주소, 게시물 조회 비밀번호, 문의 내용(제목, 문의 내용(제목, 문의내용, 첨부파일)\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"비즈니스상담 · 비즈니스 상담 응대 · 필수) 법인명, 본사 소재지, 이름, 이메일, 연락처\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"2. 개인정보의 보유 및 이용기간\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 회사에서 제공하는 서비스를 이용하는 동안 회사는 이용자들의 개인정보를 계속적으로 보유하며 서비스 제공 등을 위해 이용합니다. 다만, 정보주체의 삭제 요청 있을 시 개인정보를 지체없이 파기 합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"보존 항목 · 보존 목적 · 보존 근거 · 보존 기간\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"필수) 이름, 전화번호, 이메일 주소, 문의내용 · 고객 문의 응대 처리 및 처리 이력관리 · 소비자 불만 또는 분쟁 처리에 관한 기록 · 3년\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"필수) 법인명, 본사소재지, 이름, 이메일, 연락처 · 비즈니스 상담 응대처리 및 처리 이력 관리\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"IP Adress 로그인 기록 · 서비스 유지 및 사용 기록 확인 · 통신비밀보호법 · 3개월\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"3. 개인정보의 파기절차 및 방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"회사는 원칙적으로 개인정보 수집 및 이용목적이 달성된 후에는 해당 정보를 지체 없이 파기합니다. 파기절차 및 방법은 다음과 같습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"1) 파기절차 : 이용자들이 서비스를 제공 받기 위해 입력하신 정보는 목적이 달성된 후 내부 방침 및 기타 관련 법령에 의한 정보보호사유에 따라(보유 및 이용기간 참조) 일정기간 저장된 후 파기되어집니다. 동 개인정보는 법률에 의한 경우가 아니고서는 보유되어지는 것 외의 다른 목적으로 이용되지 않습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"2) 파기방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 가. 전자적 파일형태로 저장된 개인정보는 기록을 재생할 수 없는 기술적방법을 사용하여 삭제합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 나. 종이에 출력된 개인정보는 분쇄기로 분쇄하거나 소각을 통하여 파기합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"4. 개인정보 제공\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"회사는 이용자의 개인정보를 원칙적으로 외부에 제공하지 않습니다. 다만, 아래의 경우에는 예외로 합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"1) 이용자들이 사전에 동의한 경우\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 2) 법령의 규정에 의거하거나, 수사 목적으로 법령에 정해진 절차와 방법에 따라 수사기관의 요구가 있는 경우\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"5. 수집한 개인정보의 위탁\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 회사는 이용자의 동의 없이 개인정보를 외부 업체에 위탁하지 않습니다. 향후 그러한 필요가 생길 경우, 위탁 대상자와 위탁 업무 내용에 대해 이용자에게 통지하고 필요한 경우 사전 동의를 받도록 하겠습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"6. 이용자 및 법정대리인의 권리와 그 행사방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"이용자는 개인의 정보를 열람할 수 있으며 보관된 개인정보에 대해 수정 요청할 수 있습니다. 개인정보의 변경 및 삭제는 고객지원의 홈페이지 문의를 통하여 할 수 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"7. 개인정보 자동수집 장치의 설치, 운영 및 그 거부에 관한 사항\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 회사는 이용자의 정보를 수시로 저장하고 찾아내는 '쿠키(cookie)' 등을 운용합니다. 쿠키란 회사의 웹사이트를 운영하는데 이용되는 서버가 이용자의 브라우저에 보내는 아주 작은 텍스트 파일로서 귀하의 컴퓨터 하드디스크에 저장됩니다. 회사는 다음과 같은 목적을 위해 쿠키를 사용합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 1) 쿠키 등 사용 목적 : 이용자의 방문 회수 파악 및 접속한 웹 페이지의 분석, 기타 서비스(온라인 문의, 주식정보 등)를 사용하기 위한 목적으로 이용됩니다. 이용자는 쿠키 설치에 대한 선택권을 가지고 있습니다. 따라서, 이용자는 웹 브라우저에서 옵션을 설정함으로써 모든 쿠키를 허용하거나, 쿠키가 저장될 때마다 확인을 거치거나, 아니면 모든 쿠키의 저장을 거부할 수도 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"2) 쿠키 설정 거부 방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 쿠키 설정을 거부하는 방법으로는 이용자가 사용하는 웹 브라우저의 옵션을 선택함으로써 모든 쿠키를 허용하거나 쿠키를 저장할 때마다 확인을 거치거나, 모든 쿠키의 저장을 거부할 수 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"* 쿠키 설정방법 예\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1},{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 1) Internet Explorer : 웹 브라우저 상단의 도구 \u003e 인터넷 옵션 \u003e 개인정보 \u003e 고급 (단, 이용자가 쿠키 설치를 거부하였을 경우 서비스 제공에 어려움이 있을 수 있습니다.) \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 2) Chrome : 웹 브라우저 우측의 설정 메뉴 \u003e 화면 하단의 고급 설정 표시 \u003e 개인정보의 콘텐츠 설정 버튼 \u003e 쿠키\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"8. 개인정보에 관한 민원서비스\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"회사는 이용자의 개인정보를 보호하고 개인정보와 관련한 불만을 처리하기 위하여 아래와 같이 개인정보관리책임자를 지정하고 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"9. 개인정보관리책임자\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"성명 · 소속부서 · 전화번호 · 이메일\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"한기수 · 기획팀 · 02-6972-9171 · hanks@yuyu.co.kr\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 귀하께서는 회사의 서비스를 이용하시며 발생하는 모든 개인정보보호 관련 민원을 개인정보관리책임자 혹은 담당부서로 신고하실 수 있습니다. 회사는 이용자들의 신고사항에 대해 신속하게 충분한 답변을 드릴 것입니다. 기타 개인정보침해에 대한 신고나 상담이 필요하신 경우, 아래 기관에 문의하시기 바랍니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"개인분쟁조정위원회\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\"text\":\" www.1336.or.kr \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\"text\":\" 1336 \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\" ",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"1. 수집하는 개인정보 항목\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"당사는 고객문의 및 비즈니스 상담 등을 위해 아래와 같은 개인정보를 수집하고 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"서비스명 · 수집목적 · 수집항목\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"고객문의 · 고객문의 응대 · 필수) 이름, 연락처(천화번호), 이메일주소, 게시물 조회 비밀번호, 문의 내용(제목, 문의 내용(제목, 문의내용, 첨부파일)\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"비즈니스상담 · 비즈니스 상담 응대 · 필수) 법인명, 본사 소재지, 이름, 이메일, 연락처\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"2. 개인정보의 보유 및 이용기간\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 회사에서 제공하는 서비스를 이용하는 동안 회사는 이용자들의 개인정보를 계속적으로 보유하며 서비스 제공 등을 위해 이용합니다. 다만, 정보주체의 삭제 요청 있을 시 개인정보를 지체없이 파기 합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"보존 항목 · 보존 목적 · 보존 근거 · 보존 기간\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"필수) 이름, 전화번호, 이메일 주소, 문의내용 · 고객 문의 응대 처리 및 처리 이력관리 · 소비자 불만 또는 분쟁 처리에 관한 기록 · 3년\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"필수) 법인명, 본사소재지, 이름, 이메일, 연락처 · 비즈니스 상담 응대처리 및 처리 이력 관리\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"IP Adress 로그인 기록 · 서비스 유지 및 사용 기록 확인 · 통신비밀보호법 · 3개월\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"3. 개인정보의 파기절차 및 방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"회사는 원칙적으로 개인정보 수집 및 이용목적이 달성된 후에는 해당 정보를 지체 없이 파기합니다. 파기절차 및 방법은 다음과 같습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"1) 파기절차 : 이용자들이 서비스를 제공 받기 위해 입력하신 정보는 목적이 달성된 후 내부 방침 및 기타 관련 법령에 의한 정보보호사유에 따라(보유 및 이용기간 참조) 일정기간 저장된 후 파기되어집니다. 동 개인정보는 법률에 의한 경우가 아니고서는 보유되어지는 것 외의 다른 목적으로 이용되지 않습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"2) 파기방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 가. 전자적 파일형태로 저장된 개인정보는 기록을 재생할 수 없는 기술적방법을 사용하여 삭제합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 나. 종이에 출력된 개인정보는 분쇄기로 분쇄하거나 소각을 통하여 파기합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"4. 개인정보 제공\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"회사는 이용자의 개인정보를 원칙적으로 외부에 제공하지 않습니다. 다만, 아래의 경우에는 예외로 합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"1) 이용자들이 사전에 동의한 경우\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 2) 법령의 규정에 의거하거나, 수사 목적으로 법령에 정해진 절차와 방법에 따라 수사기관의 요구가 있는 경우\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"5. 수집한 개인정보의 위탁\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 회사는 이용자의 동의 없이 개인정보를 외부 업체에 위탁하지 않습니다. 향후 그러한 필요가 생길 경우, 위탁 대상자와 위탁 업무 내용에 대해 이용자에게 통지하고 필요한 경우 사전 동의를 받도록 하겠습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"6. 이용자 및 법정대리인의 권리와 그 행사방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"이용자는 개인의 정보를 열람할 수 있으며 보관된 개인정보에 대해 수정 요청할 수 있습니다. 개인정보의 변경 및 삭제는 고객지원의 홈페이지 문의를 통하여 할 수 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"7. 개인정보 자동수집 장치의 설치, 운영 및 그 거부에 관한 사항\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 회사는 이용자의 정보를 수시로 저장하고 찾아내는 '쿠키(cookie)' 등을 운용합니다. 쿠키란 회사의 웹사이트를 운영하는데 이용되는 서버가 이용자의 브라우저에 보내는 아주 작은 텍스트 파일로서 귀하의 컴퓨터 하드디스크에 저장됩니다. 회사는 다음과 같은 목적을 위해 쿠키를 사용합니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 1) 쿠키 등 사용 목적 : 이용자의 방문 회수 파악 및 접속한 웹 페이지의 분석, 기타 서비스(온라인 문의, 주식정보 등)를 사용하기 위한 목적으로 이용됩니다. 이용자는 쿠키 설치에 대한 선택권을 가지고 있습니다. 따라서, 이용자는 웹 브라우저에서 옵션을 설정함으로써 모든 쿠키를 허용하거나, 쿠키가 저장될 때마다 확인을 거치거나, 아니면 모든 쿠키의 저장을 거부할 수도 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"2) 쿠키 설정 거부 방법\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 쿠키 설정을 거부하는 방법으로는 이용자가 사용하는 웹 브라우저의 옵션을 선택함으로써 모든 쿠키를 허용하거나 쿠키를 저장할 때마다 확인을 거치거나, 모든 쿠키의 저장을 거부할 수 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"* 쿠키 설정방법 예\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1},{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 1) Internet Explorer : 웹 브라우저 상단의 도구 \u003e 인터넷 옵션 \u003e 개인정보 \u003e 고급 (단, 이용자가 쿠키 설치를 거부하였을 경우 서비스 제공에 어려움이 있을 수 있습니다.) \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"type\":\"linebreak\",\"version\":1},{\"mode\":\"normal\",\"text\":\" 2) Chrome : 웹 브라우저 우측의 설정 메뉴 \u003e 화면 하단의 고급 설정 표시 \u003e 개인정보의 콘텐츠 설정 버튼 \u003e 쿠키\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"8. 개인정보에 관한 민원서비스\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"회사는 이용자의 개인정보를 보호하고 개인정보와 관련한 불만을 처리하기 위하여 아래와 같이 개인정보관리책임자를 지정하고 있습니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"9. 개인정보관리책임자\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"성명 · 소속부서 · 전화번호 · 이메일\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":1,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"한기수 · 기획팀 · 02-6972-9171 · hanks@yuyu.co.kr\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" 귀하께서는 회사의 서비스를 이용하시며 발생하는 모든 개인정보보호 관련 민원을 개인정보관리책임자 혹은 담당부서로 신고하실 수 있습니다. 회사는 이용자들의 신고사항에 대해 신속하게 충분한 답변을 드릴 것입니다. 기타 개인정보침해에 대한 신고나 상담이 필요하신 경우, 아래 기관에 문의하시기 바랍니다.\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\",\"textStyle\":\"\",\"textFormat\":0},{\"tag\":\"h3\",\"type\":\"heading\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\"개인분쟁조정위원회\",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1}],\"direction\":\"ltr\"},{\"type\":\"paragraph\",\"format\":\"\",\"indent\":0,\"version\":1,\"children\":[{\"mode\":\"normal\",\"text\":\" \",\"type\":\"text\",\"style\":\"\",\"detail\":0,\"format\":0,\"version\":1},{\"mode\":\"normal\",\
