<!doctype html>

<meta name="robots" content="noindex,nofollow">

<title>YUYU HEALTHCARE — v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--ink:#0d1a14;--forest:#0f2a1e;--leaf:#139654;--mint:#cfe9d9;--sage:#eef3ee;--paper:#f7f8f4;--line:rgba(13,26,20,.12);--mono:'JetBrains Mono',monospace;--serif:'Instrument Serif',serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:Pretendard,system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
html[lang=zh] body{font-family:Pretendard,'Noto Sans SC',sans-serif}
img{display:block;max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding:0 48px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
/* header pill */
.nav{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:28px;background:rgba(247,248,244,.92);backdrop-filter:blur(10px);border-radius:999px;padding:10px 10px 10px 22px;box-shadow:0 6px 30px rgba(0,0,0,.12)}
.nav img{height:20px}
.nav ul{white-space:nowrap;display:flex;gap:22px;list-style:none;font-size:14px;font-weight:500}
.lang{white-space:nowrap;display:flex;align-items:center;gap:4px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;position:relative;background:#fff}
.lang menu{display:none;position:absolute;top:110%;right:0;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);list-style:none;padding:6px;min-width:120px}
.lang.open menu{display:block}
.lang menu li{padding:8px 12px;border-radius:8px}
.lang menu li:hover,.lang menu li.on{background:var(--sage)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--leaf);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.6)}
.btn.dark{background:var(--forest)}
/* hero */
.hero{position:relative;height:100vh;min-height:720px;color:#fff;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.8)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.05) 40%,rgba(5,20,12,.75))}
.hero .in{position:absolute;z-index:2;left:0;right:0;bottom:72px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,9vw,148px);line-height:.92;letter-spacing:-.02em}
html[lang=ko] .hero h1,html[lang=zh] .hero h1{font-family:inherit;font-weight:700;letter-spacing:-.04em;line-height:1.02;font-size:clamp(48px,7.4vw,124px)}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-top:36px}
.hero p{max-width:460px;font-size:17px;line-height:1.6;opacity:.9}
.tag{display:inline-block;border:1px dashed rgba(255,255,255,.7);border-radius:6px;padding:4px 8px;font-size:11px;font-family:var(--mono);opacity:.85}
.tag.dk{border-color:rgba(13,26,20,.45);color:rgba(13,26,20,.7)}
/* sections */
section{padding:140px 0}
.eyebrow{color:var(--leaf);margin-bottom:20px}
h2{font-size:clamp(36px,4.6vw,64px);line-height:1.08;letter-spacing:-.03em;font-weight:700}
.lead{font-size:18px;line-height:1.65;color:rgba(13,26,20,.7);max-width:520px}
.split{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:56px}
/* dosage: Seed style */
.dosage{background:var(--forest);color:#fff}
.dosage .lead{color:rgba(255,255,255,.7)}
.dosage .eyebrow{color:#8fd8ae}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pcard{background:#2f5a3f;border-radius:22px;padding:22px;display:flex;flex-direction:column;min-height:420px}
.pcard .code{align-self:flex-start;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:3px 10px;font-family:var(--mono);font-size:11px}
.pcard h3{font-size:22px;margin:14px 0 6px;font-weight:600}
.pcard small{opacity:.7;font-size:13px}
.pcard .ph{flex:1;margin:18px 0;border-radius:14px;background:radial-gradient(circle at 50% 45%,#e9efe9,#b9cdbf);display:grid;place-items:center;overflow:hidden}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .ph span{font-family:var(--mono);font-size:11px;color:#2f5a3f}
.pcard .acts{display:flex;gap:10px;align-items:center}
.pcard .acts a{color:#fff;font-size:13px;text-decoration:underline;text-underline-offset:4px}
.pcard .acts .btn{background:#0f2a1e;padding:9px 14px;font-size:13px;text-decoration:none}
/* process: Atlas style */
.process{background:#0b0f0d;color:#eaeee9;position:relative;overflow:hidden;padding:0}
.process .stage{height:100vh;min-height:720px;position:relative;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:calc(100%/6) calc(100%/4)}
.process .meta{position:absolute;top:120px;left:48px;display:flex;gap:120px}
.process .num{font-family:var(--mono);font-size:40px}
.process .dots{display:flex;gap:8px;margin-top:12px}
.process .dots i{width:7px;height:7px;border-radius:50%;border:1px solid #eaeee9}
.process .dots i.on{background:#eaeee9}
.process .ttl{font-size:28px;line-height:1.1}
.process .desc{position:absolute;left:48px;top:52%;max-width:260px;font-size:14px;line-height:1.6;opacity:.8}
.process .big{position:absolute;right:40px;bottom:10px;font-size:clamp(90px,15vw,230px);font-weight:800;letter-spacing:-.05em;line-height:.8}
.process .art{position:absolute;left:50%;top:44%;transform:translate(-30%,-50%);width:min(40vw,520px);aspect-ratio:1;border:1px dashed rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center;text-align:center}
.process .art svg{width:70%}
.process .steps{position:absolute;right:48px;top:120px;text-align:right;font-family:var(--mono);font-size:12px;line-height:2;opacity:.6}
.process .steps b{opacity:1;color:#8fd8ae;font-weight:500}
/* stats: T1 style */
.stats .layout{display:grid;grid-template-columns:1fr 1.2fr;gap:80px;align-items:start}
.stats .photo{border-radius:28px;overflow:hidden;aspect-ratio:1;position:sticky;top:120px}
.stats .photo img{width:100%;height:100%;object-fit:cover}
.stat{border-top:1px solid var(--line);padding:34px 0}
.stat b{display:block;font-size:clamp(64px,8vw,120px);font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat.pending b{color:rgba(13,26,20,.25)}
.stat .mono{color:rgba(13,26,20,.6);margin-top:10px;display:block}
.stat .mono em{font-style:normal;color:#b5651d;margin-left:8px}
/* certs: Legora style */
.certs{background:#0b0f0d;color:#eaeee9}
.certs .head{text-align:center;max-width:760px;margin:0 auto 64px}
.certs .head h2{font-family:var(--serif);font-weight:400;font-size:clamp(32px,3.6vw,48px);letter-spacing:0;line-height:1.2}
html[lang=ko] .certs .head h2,html[lang=zh] .certs .head h2{font-family:inherit;font-weight:600;letter-spacing:-.02em}
.cg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid rgba(255,255,255,.15)}
.cg div{padding:28px;min-height:300px;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.15)}
.cg div:last-child{border-right:0}
.cg h4{font-size:18px;font-weight:600;margin-bottom:12px}
.cg p{font-size:14px;line-height:1.6;opacity:.65;flex:1}
.cg img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:50%;padding:8px}
/* contact: In Common With style */
.contact{background:#5b1f12;background:var(--forest);color:#f2efe6}
.contact .layout{display:grid;grid-template-columns:1fr 1fr;gap:80px}
.contact h2{margin-bottom:40px}
.ctab{width:100%;border-collapse:collapse;font-size:14px}
.ctab td{border-top:1px solid rgba(255,255,255,.18);padding:14px 0}
.ctab td:first-child{opacity:.7;width:40%}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .f{border:1px solid rgba(255,255,255,.35);padding:13px 14px;font-size:14px;color:rgba(242,239,230,.6)}
form .w{grid-column:1/-1}
form .ta{height:120px}
form .seg{grid-column:1/-1;display:flex;gap:8px}
form .seg span{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px;font-size:13px}
form .seg span.on{background:#f2efe6;color:var(--forest)}
form button{grid-column:1/-1;background:#f2efe6;color:var(--forest);border:0;padding:15px;font-size:15px;font-weight:600;font-family:inherit}
/* footer: Notion style */
footer{padding:80px 0 48px;background:var(--paper)}
footer .layout{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:32px;font-size:14px}
footer h5{font-size:14px;margin-bottom:14px}
footer li{list-style:none;color:rgba(13,26,20,.65);line-height:2}
footer .lang{display:inline-flex;margin-top:22px}
footer .copy{margin-top:56px;font-size:12px;color:rgba(13,26,20,.5);line-height:1.8}
@media (max-width:900px){
 .wrap{padding:0 20px}
 .nav{left:16px;right:16px;transform:none;justify-content:space-between;gap:10px;padding:8px 8px 8px 16px}
 .nav ul,.nav .btn{display:none}
 .burger{display:grid!important}
 .hero .row{flex-direction:column;align-items:flex-start}
 section{padding:96px 0}
 .split{flex-direction:column;align-items:flex-start}
 .grid4{grid-template-columns:1fr 1fr}
 .pcard{min-height:320px}
 .process .meta{left:20px;gap:40px;top:100px}.process .steps{display:none}
 .process .art{left:50%;transform:translate(-50%,-50%);width:72vw}
 .process .desc{left:20px;top:auto;bottom:130px}
 .stats .layout,.contact .layout{grid-template-columns:1fr;gap:40px}
 .stats .photo{position:static;aspect-ratio:16/10}
 .cg{grid-template-columns:1fr 1fr}.cg div{min-height:220px;border-bottom:1px solid rgba(255,255,255,.15)}
 footer .layout{grid-template-columns:1fr 1fr}
}
.burger{display:none;width:38px;height:38px;border-radius:50%;background:var(--forest);color:#fff;place-items:center;font-size:16px}
</style>
</head>

function set(l){const t=T[l];document.documentElement.lang=l;
 document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=t[e.dataset.t]);
 document.getElementById('lname').textContent=t.name;document.querySelector('.lname2').textContent=t.name;
 document.querySelectorAll('menu li').forEach(e=>e.classList.toggle('on',e.dataset.l===l));
 document.getElementById('cards').innerHTML=t.d.map((d,i)=>`<div class="pcard"><span class="code">${d[0]}</span><h3>${d[1]}</h3><small>${d[2]}</small><div class="ph">${i==1?'<img src="capsule.png">':'<span>3D RENDER</span>'}</div><div class="acts"><a class="btn">${t.ask}</a><a>${t.spec}</a></div></div>`).join('');
 document.getElementById('steps').innerHTML=t.st.map((s,i)=>i==2?`<b>${s}</b>`:s).join('<br>');
 document.getElementById('certs').innerHTML=t.c.map((c,i)=>`<div><h4>${c[0]}</h4><p>${c[1]}</p><img src="${certImg[i]}"></div>`).join('');
 document.getElementById('ctab').innerHTML=t.ct.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
 document.getElementById('seg').innerHTML=t.seg.map((s,i)=>`<span class="${i?'':'on'}">${s}</span>`).join('');
 ['f1','f2','f3','f4'].forEach(k=>document.getElementById(k).innerHTML=t[k].map(x=>`<li>${x}</li>`).join(''));
 history.replaceState(null,'','?lang='+l)}
document.querySelectorAll('menu li').forEach(e=>e.onclick=ev=>{ev.stopPropagation();set(e.dataset.l);e.closest('.lang').classList.remove('open')});
set(new URLSearchParams(location.search).get('lang')||'ko');
